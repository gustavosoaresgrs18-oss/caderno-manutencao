<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno de Manutenção</title>
  </head>
  <body>
    <div class="dashboard">

      <h1>Caderno Digital de Manutenção</h1>

      <div class="cards-grid">
        <div class="card">
          <span class="card-label">Km hoje</span>
          <span class="card-valor">142 km</span>
        </div>
        <div class="card">
          <span class="card-label">Lucro do dia</span>
          <span class="card-valor">R$ 187</span>
        </div>
        <div class="card">
          <span class="card-label">Custo / km</span>
          <span class="card-valor">R$ 0,43</span>
        </div>
        <div class="card">
          <span class="card-label">Próx. revisão</span>
          <span class="card-valor">830 km</span>
        </div>
      </div>

      <div class="alertas">
        <div class="alerta vermelho">
          <span class="alerta-nome">Troca de óleo</span>
          <span class="alerta-status">Vencida</span>
        </div>
        <div class="alerta amarelo">
          <span class="alerta-nome">Rodízio de pneus</span>
          <span class="alerta-status">830 km</span>
        </div>
        <div class="alerta verde">
          <span class="alerta-nome">Filtro de ar</span>
          <span class="alerta-status">Ok</span>
        </div>
      </div>

      <div class="registro-rapido">
        <button class="botao-principal">
          Registrar Km do Dia
        </button>
      </div>

      <nav class="nav-inferior">
        <button class="nav-item ativo">
          <span class="nav-icone">🏠</span>
          <span class="nav-texto">Início</span>
        </button>
        <button class="nav-item">
          <span class="nav-icone">🔧</span>
          <span class="nav-texto">Manutenção</span>
        </button>
        <button class="nav-item">
          <span class="nav-icone">⛽</span>
          <span class="nav-texto">Combustível</span>
        </button>
        <button class="nav-item">
          <span class="nav-icone">💰</span>
          <span class="nav-texto">Finanças</span>
        </button>
      </nav>

    </div>
  </body>
</html>
